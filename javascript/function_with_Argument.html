<!DOCTYPE html>

<body>
    <script>
        function printName(name,age){
            console.log(`${name}'s age is ${age}`);
        }
        printName("Developer",24);



        function sum(a,b){
            console.log(a+b);
        }

        sum(2,3);
        sum(4,6);
        sum(7,0);

    </script>
    <script>
        // practice problems on function
        //create a function that gives us the average of 3 numbers 
        function avgNumber(a,b,c){
            let avg = (a+b+c)/3
            console.log(avg);
        }
        avgNumber(3,4,5);
        avgNumber(3,3,3);



        // Q.2 create a function that prints the multiplication table of a number 
        function multiNumber(num){
            for(let i=num; i<=num*10; i=i+num){
                console.log(i);
            }
        }

        multiNumber(2);
        multiNumber(96);
    </script>
</body>
