<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loops_js</title>
</head>
<body>
    <script>
        // Loops - Used to iterate(repeat) a piece of code
        // FOR LOOP =>for(initialisation;condition;updation){ do something}
        for(let i = 1; i<=5 ;i++){
            console.log(i);
        }

    </script>

    <script>
        // dry run -- solve on  paper and pen
        for(let i=5; i>=1; i--){
            console.log(i);
        }
    </script>
    <script>
        
        for(let i=10; i>=1; i=i-3){
            console.log(i);
        }
    </script>

    <script>
        // print all odd numbers (1 to 15)
        for(let i=1; i<=15; i = i+2){
            console.log(i);
        }
        console.log("backwards");
        for(let i=15;i>=1;i=i-2){
            console.log(i);
        }
    </script>
    <script>
        // print all even numbers
        for(let i=2; i<=10; i = i+2){
            console.log(i);
        }
        // backward
        console.log("backward");
        for(let i=10;i>=2; i = i-2){
            console.log(i);
        }
    </script>


</body>
</html>
