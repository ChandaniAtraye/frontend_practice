<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sort_in_arrays</title>
</head>
<body>
    <script>
        //sort:sorts an array
        let cars=["audi","maruti","xuv","bmw","nexon"];
        cars.sort();
        console.log(cars);
        let character =['a','f','d','g'];
        character.sort();
        console.log(character);
        let numbers = [32,45,67,100];
        numbers.sort();
        console.log(numbers);
    </script>
</body>
</html>
