<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <script>
    const max = prompt("Enter a max number");
   
    let output = Math.floor(Math.random() * max) + 1;

    let guess = prompt("Guess the random number");

     while(true){
        if(guess=="quit"){
            console.log("user quit");
            break;
        }
        if(guess == output){
            console.log("You are right! Congrats!!" ,output);
            break;
        }else if(guess<output){
           guess=prompt(" hint: your guess was too small.please try again");
        }else if(guess>output){
            guess=prompt(" hint : Your number was too large .please try again")
        }
        // else{
        //     guess = prompt("Your guess was wrong! Try Again !!");
        // }
     }
   </script> 
</body>
</html>
