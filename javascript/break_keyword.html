<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>break_keyword</title>
</head>
<body>
    <script>
        // break keyword - used to exist from the loop
        let i =1;
        while(i<=5){
            if(i==3){
                break;
            }
            console.log(i);
            i++;
        }
    </script>
</body>
</html>
