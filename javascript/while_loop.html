<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>while_loop</title>
</head>
<body>
    <script>
        // while loop - same as for 
        // syntax - while(condition){
        // (do something)
        // }
        let i =1; // forward o/p 1,2,3,4,5
        while(i<=5){
            console.log(i);
            i++;
        }

        let j = 5; // backward o/p 1,2,3,4,5
        while(j>=1){
            console.log(j);
            j--;
        }
    </script>
    <script>
        // print number from 0 to 20
        let k=1;
        while(k<=20){
            console.log(k);
            k=k+2;
        }
    </script>
</body>
</html>
